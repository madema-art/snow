<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- SNOW boot splash (shown by the engine while the mountain is generated).
       The corners are the exact boot-splash background colour (#070c16) so the
       image blends into any aspect ratio. Render with tools/render_branding.js. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.62" r="0.75">
      <stop offset="0" stop-color="#14305a"/>
      <stop offset="0.55" stop-color="#0b1a36"/>
      <stop offset="1" stop-color="#070c16"/>
    </radialGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25f0a0" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#2ff5a8" stop-opacity="0.8"/>
      <stop offset="0.7" stop-color="#27d6e6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#8a5cf0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7e5fa"/>
      <stop offset="1" stop-color="#6d8bbd"/>
    </linearGradient>
    <linearGradient id="ridgeshade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ba6d2"/>
      <stop offset="1" stop-color="#3a5788"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#070c16" stop-opacity="0"/>
      <stop offset="1" stop-color="#070c16" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.7" stop-color="#070c16" stop-opacity="0"/>
      <stop offset="1" stop-color="#070c16" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe0ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <path d="M 200 330 C 520 180, 760 330, 1040 240 S 1500 150, 1760 270" fill="none" stroke="url(#aurora)" stroke-width="150" filter="url(#soft)" opacity="0.6"/>
  <path d="M 300 470 C 600 370, 860 460, 1120 380 S 1480 340, 1660 420" fill="none" stroke="url(#aurora)" stroke-width="60" filter="url(#soft)" opacity="0.4"/>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="340" cy="210" r="2.6"/><circle cx="520" cy="130" r="2"/><circle cx="700" cy="190" r="1.8"/><circle cx="880" cy="110" r="2.4"/>
    <circle cx="1090" cy="150" r="1.8"/><circle cx="1270" cy="100" r="2.2"/><circle cx="1620" cy="180" r="2"/><circle cx="430" cy="330" r="1.6"/>
    <circle cx="1540" cy="330" r="1.8"/><circle cx="1180" cy="290" r="1.5"/><circle cx="640" cy="300" r="1.4"/><circle cx="1400" cy="240" r="1.6"/>
    <circle cx="240" cy="420" r="1.6"/><circle cx="1700" cy="430" r="1.5"/><circle cx="980" cy="200" r="1.3"/>
  </g>
  <circle cx="1390" cy="250" r="150" fill="url(#moonglow)"/>
  <circle cx="1390" cy="250" r="46" fill="#f6f1df"/>
  <!-- mountain -->
  <path d="M 380 1080 L 720 660 L 800 740 L 960 470 L 1150 760 L 1230 690 L 1540 1080 Z" fill="url(#ridge)"/>
  <path d="M 960 470 L 1150 760 L 1230 690 L 1540 1080 L 1060 1080 L 1010 820 L 1040 700 L 985 590 Z" fill="url(#ridgeshade)"/>
  <path d="M 952 520 C 915 610, 990 650, 938 750 S 965 880, 900 960" fill="none" stroke="#ff7a2a" stroke-width="9" stroke-linecap="round"/>
  <rect width="1920" height="1080" fill="url(#fade)"/>
  <!-- wordmark -->
  <text x="960" y="392" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="300" font-size="170" letter-spacing="74" fill="#f4f8ff" dx="37">SNOW</text>
  <rect x="820" y="432" width="280" height="5" rx="2.5" fill="#ff7a2a"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
