; SNOW runtime presentation (Godot loads this file on top of project.godot when
; the game runs; the editor ignores it). It lives here, rather than in
; project.godot, so that adding branding never conflicts with a project.godot
; the editor may have rewritten on a player's PC.

[application]

config/icon="res://branding/icon_256.png"
config/windows_native_icon="res://branding/snow.ico"
boot_splash/image="res://branding/splash.png"
boot_splash/bg_color=Color(0.027, 0.047, 0.086, 1)
boot_splash/show_image=true
boot_splash/stretch_mode=1
boot_splash/use_filter=true
